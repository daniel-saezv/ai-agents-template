name: Copilot Setup Steps

# Prepares the Copilot cloud agent environment before each session, so subagents do not
# spend time installing tools. Only steps, runs-on and timeout-minutes are honored.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called copilot-setup-steps.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Replace with your stack, for example:
      # - uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '10.0.x'
      # - run: dotnet restore
      #
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '22'
      #     cache: npm
      # - run: npm ci
