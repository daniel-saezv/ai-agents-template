name: Copilot Setup Steps

# Prepares the Copilot cloud agent environment before each session. Only steps,
# runs-on, services, snapshot, timeout-minutes and permissions of this job are
# honored. timeout-minutes limits the whole agent session (max 59), not only setup.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called copilot-setup-steps.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install the runtime and dependencies of your stack, for example:
      # - uses: actions/setup-node@v6
      #   with:
      #     node-version: '24'
      #     cache: npm
      # - run: npm ci
      # - run: npx playwright install --with-deps chromium
