name: Agent development loop

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue que debe arrancar
        required: true
        type: string

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  start:
    # Filter here: irrelevant events are skipped and never fetch the Copilot token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
        contains(github.event.issue.body, 'agent-loop')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
        github.event.label.name == 'agent-loop' && !contains(github.event.issue.body, 'agent-loop')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        contains(github.event.comment.body, '/agent '))
    uses: daniel-saezv/AI-Agents/.github/workflows/agent-dev-loop.yml@v1.3.0
    with:
      engine_ref: v1.3.0
      issue_number: ${{ inputs.issue_number || '' }}
