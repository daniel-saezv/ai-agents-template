name: Agent development loop

on:
  # Creating an issue with the label also emits `labeled`; `opened` would start a second run.
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue que debe asignarse a Copilot
        required: true
        type: string
      custom_agent:
        description: developer, o developer-lite para el modo de bajo coste
        required: true
        type: choice
        options: [developer, developer-lite]
        default: developer

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  start:
    # Filter here: irrelevant events are skipped and never fetch the Copilot token.
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-loop' ||
      github.event.label.name == 'agent-loop-lite'
    uses: daniel-saezv/AI-Agents/.github/workflows/agent-dev-loop.yml@v2.5.1
    with:
      issue_number: ${{ inputs.issue_number || github.event.issue.number }}
      custom_agent: ${{ inputs.custom_agent || (github.event.label.name == 'agent-loop-lite' && 'developer-lite') || 'developer' }}
