name: Agent development loop

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  push:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Numero de la issue que debe arrancar o continuar
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

jobs:
  orchestrate:
    uses: daniel-saezv/AI-Agents/.github/workflows/agent-dev-loop.yml@main
    with:
      issue_number: ${{ inputs.issue_number || '' }}
      push_event: ${{ github.event_name == 'push' && toJson(github.event) || '' }}
