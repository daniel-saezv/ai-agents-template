name: Agent development loop

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  push:
    paths:
      - .github/agent-loop-handoff.md
  workflow_dispatch:
    inputs:
      issue_number:
        description: Numero de la issue que debe arrancar o continuar
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: read
  id-token: write

jobs:
  orchestrate:
    if: github.event_name != 'push'
    uses: daniel-saezv/AI-Agents/.github/workflows/agent-dev-loop.yml@main
    with:
      issue_number: ${{ inputs.issue_number || '' }}
  relay:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the agent handoff
        uses: daniel-saezv/AI-Agents@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}