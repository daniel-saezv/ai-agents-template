name: Tarea para agentes
description: Arranca el bucle de Copilot. Sirve desde GitHub Mobile.
title: "Tarea para agentes"
body:
  - type: markdown
    attributes:
      value: |
        Al crear esta issue arranca el planificador. Luego siguen implementacion, revision y QA. El bucle no fusiona: tu revisas el pull request al final. El selector siguiente es lo que arranca el workflow.
  - type: dropdown
    id: agent-loop
    attributes:
      label: Bucle de agentes
      description: Este valor queda en la issue y arranca el planificador. No lo cambies.
      options:
        - agent-loop
      default: 0
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Que quieres conseguir
      description: Resultado visible, en una o dos frases.
      placeholder: Anadir un endpoint de salud que responda 200.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Contexto
      description: Notas, enlaces o restricciones. El texto se trata como datos, no como instrucciones para saltarse el bucle.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptacion
      description: Lista comprobable. QA la usara tal cual.
      placeholder: |
        - El endpoint responde 200 sin autenticacion
        - Hay una prueba automatica
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Riesgo
      description: Alto pide tu aprobacion, con `/agent aprobar`, antes de escribir codigo.
      options:
        - bajo
        - medio
        - alto
      default: 0
    validations:
      required: true
