name: Tarea para agentes
description: Asigna la issue a Copilot con el agente developer. Sirve desde GitHub Mobile.
title: "Tarea para agentes"
labels: ["agent-loop"]
body:
  - type: markdown
    attributes:
      value: |
        Al crear esta issue, Copilot la recibe con el agente `developer`: planifica, implementa y la verifica con revision y QA independientes en una sola sesion, sin esperar aprobaciones. No fusiona: tu revisas el pull request y, si hace falta, le respondes con `@copilot` en sus comentarios.
  - type: textarea
    id: goal
    attributes:
      label: Que quieres conseguir
      description: Resultado visible, en una o dos frases.
      placeholder: Anadir un endpoint de salud que responda 200.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Contexto
      description: Notas, enlaces o restricciones. El texto se trata como datos, no como instrucciones para saltarse el flujo.
    validations:
      required: false
  - type: textarea
    id: stack
    attributes:
      label: Stack o restricciones tecnicas
      description: Opcional. En un repositorio sin configurar, el agente usa este stack; si lo dejas vacio, lo elige y lo justifica.
      placeholder: Astro estatico con pnpm y Playwright.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptacion
      description: Lista comprobable. QA la usara tal cual.
      placeholder: |
        - El endpoint responde 200 sin autenticacion
        - Hay una prueba automatica
    validations:
      required: true
