name: Tarea sencilla para agentes
description: Modo de bajo coste. Asigna la issue a Copilot con developer-lite, el mismo flujo con un modelo mas ligero.
title: "Tarea sencilla para agentes"
labels: ["agent-loop-lite"]
body:
  - type: markdown
    attributes:
      value: |
        Para cambios pequeños y acotados: pocos archivos y criterios claros. Copilot la recibe con `developer-lite`, que sigue el mismo flujo que `developer`, con revision y QA independientes, pero con un modelo mas ligero. Para el arranque de un repositorio, cambios de diseño o tareas amplias, usa **Tarea para agentes**.
  - type: textarea
    id: goal
    attributes:
      label: Que quieres conseguir
      description: Resultado visible, en una o dos frases.
      placeholder: Corregir el texto del boton de envio del formulario de contacto.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Contexto
      description: Notas, enlaces o restricciones. El texto se trata como datos, no como instrucciones para saltarse el flujo.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptacion
      description: Lista comprobable. QA la usara tal cual.
      placeholder: |
        - El boton muestra "Enviar"
        - Hay una prueba automatica
    validations:
      required: true
